[package]
name = "stern4rust-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The rules behind cargo-stern4rust: a Rust workspace held to its house coding rules, every file that breaks one named"
readme = "README.md"
documentation = "https://docs.rs/stern4rust-core"
keywords = ["lint", "conventions", "static-analysis"]
categories = ["development-tools"]

autotests = false

[lib]
name = "stern4rust"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[lints]
workspace = true

[dependencies]
globset = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
