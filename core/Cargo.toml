[package]
name = "cargo-stern4rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo subcommand that fails the build when a Rust workspace breaks a house coding rule, such as AAA test structure or one struct per file"
readme = "../README.md"
documentation = "https://docs.rs/cargo-stern4rust"
keywords = ["cargo", "subcommand", "lint", "conventions", "cli"]
categories = [
    "development-tools::cargo-plugins",
    "development-tools",
    "command-line-utilities",
]

autotests = false

[lib]
name = "stern4rust"

[[bin]]
name = "cargo-stern4rust"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
globset = { workspace = true }
clap = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
syn = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
