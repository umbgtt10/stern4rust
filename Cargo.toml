[package]
name = "cargo-stern4rust"
version = "0.10.4"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
description = "Cargo subcommand that fails the build when a Rust workspace breaks a house coding rule, such as AAA test structure or one struct per file"
license = "MIT"
readme = "README.md"
repository = "https://github.com/umbgtt10/stern4rust"
documentation = "https://docs.rs/cargo-stern4rust"
keywords = ["cargo", "subcommand", "lint", "conventions", "cli"]
categories = [
    "development-tools::cargo-plugins",
    "development-tools",
    "command-line-utilities",
]

autotests = false

[lib]
name = "stern4rust"

[[bin]]
name = "cargo-stern4rust"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
anyhow = "1.0.98"
cargo_metadata = "0.23.1"
globset = "0.4.16"
clap = { version = "4.6.0", features = ["derive"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
syn = { version = "2.0", features = ["full", "parsing", "printing", "visit"] }
walkdir = "2.5.0"

[dev-dependencies]
clap = { version = "4.6.0", features = ["derive"] }
