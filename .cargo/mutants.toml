# What cargo-mutants mutates here, for a hand run and for sentinel4rust alike:
# stern4rust-core, the technology-free rules, against core's own tests only.
# cli (cargo metadata, the file system, TOML, JSON, clap, stdout) and xtask (the
# gates) are not mutated. From the workspace root every package is selected and
# this glob keeps core's files; the baseline then tests only the mutated
# package, and each mutant runs that package's tests, which test_workspace says
# outright.
examine_globs = ["core/src/**/*.rs"]
test_workspace = false

# Mutants no test can catch, each with why.
#
# A rule judging files one by one answers check_workspace with Vec::new(), and
# a rule judging the tree answers check so; `vec![]` is the same value. The core is no_std, so the macro compiles only
# in a file that imports alloc::vec for its own use: these seven rules do, and
# the mutant builds there and changes nothing; in the others it does not
# build. Named rule by rule, because a rule whose answer is not empty has the
# same mutant, and catches it.
exclude_re = [
    "<impl Rule for (ArrangeActAssertRule|HeaderRule|ImmutableReturnsRule|ReadableSourceRule|SpdxMatchesManifestRule|TestFileNamePostfixRule|TimelessTestsRule)>::check_workspace -> Vec<Offence> with vec!\\[\\]",
    "<impl Rule for TestsLayoutRule>::check -> Vec<Offence> with vec!\\[\\]",
]
